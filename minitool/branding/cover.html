<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
body{width:540px;height:720px;background:#f7f4ed;position:relative}

.stats span{margin:0 10px}
.stats i{font-style:normal;color:#d9f99d}
